    // 濁点・半濁点の親文字マップ（ひらがな ＋ カタカナ）
    const DAKUTEN_PARENT_MAP = {
      // ひらがな
      'が':'か','ぎ':'き','ぐ':'く','げ':'け','ご':'こ',
      'ざ':'さ','じ':'し','ず':'す','ぜ':'せ','ぞ':'そ',
      'だ':'た','ぢ':'ち','づ':'つ','で':'て','ど':'と',
      'ば':'は','び':'ひ','ぶ':'ふ','べ':'へ','ぼ':'ほ',
      'ぱ':'は','ぴ':'ひ','ぷ':'ふ','ぺ':'へ','ぽ':'ほ',
      // カタカナ
      'ガ':'カ','ギ':'キ','グ':'ク','ゲ':'ケ','ゴ':'コ',
      'ザ':'サ','ジ':'シ','ズ':'ス','ゼ':'セ','ゾ':'ソ',
      'ダ':'タ','ヂ':'チ','ヅ':'ツ','デ':'テ','ド':'ト',
      'バ':'ハ','ビ':'ヒ','ブ':'フ','ベ':'ヘ','ボ':'ホ',
      'パ':'ハ','ピ':'ヒ','プ':'フ','ペ':'ヘ','ポ':'ホ'
    };

    function getPinsForChar(c) {
      if (PINS_MAP[c]) return PINS_MAP[c];

      // 濁点・半濁点の自動計算
      if (DAKUTEN_PARENT_MAP[c]) {
        const base = DAKUTEN_PARENT_MAP[c];
        const basePins = PINS_MAP[base] ? JSON.parse(JSON.stringify(PINS_MAP[base])) : [{ n:'1', x:0.3, y:0.3 }];
        const count = basePins.length;
        
        // 半濁点「゜」
        const isHandakuten = 'ぱぴぷぺぽパピプペポ'.includes(c);
        if (isHandakuten) {
          basePins.push({ n: (count + 1).toString(), x: 0.78, y: 0.20 });
        } else {
          // 濁点「゛」
          basePins.push({ n: (count + 1).toString(), x: 0.72, y: 0.20 });
          basePins.push({ n: (count + 2).toString(), x: 0.82, y: 0.24 });
        }
        return basePins;
      }

      return [{ n: '1', x: 0.32, y: 0.26 }];
    }

    let currentMode = 'hiragana';
    let currentChar = 'あ';
    let currentColor = '#ff4757';
    let isDrawing = false;
    let rainbowHue = 0;

    const wrapper = document.getElementById('canvas-card');
    const guideText = document.getElementById('guide-text');
    const drawCanvas = document.getElementById('draw-canvas');
    const drawCtx = drawCanvas.getContext('2d');
    const pinsContainer = document.getElementById('order-pins-container');
    const scrollBar = document.getElementById('char-scroll-bar');

    function renderCharSelector() {
      scrollBar.innerHTML = '';
      const list = CHAR_SETS[currentMode];
      list.forEach(c => {
        const btn = document.createElement('button');
        btn.className = `char-pill ${c === currentChar ? 'active' : ''}`;
        btn.innerText = c;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.char-pill').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentChar = c;
          sound.playPop(620);
          updateGuide();
          clearCanvas();
        });
        scrollBar.appendChild(btn);
      });
    }

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.getAttribute('data-mode');
        currentChar = CHAR_SETS[currentMode][0];
        sound.playPop(700);
        renderCharSelector();
        updateGuide();
        clearCanvas();
      });
    });

    function updateGuide() {
      guideText.innerText = currentChar;
      pinsContainer.innerHTML = '';
      const w = wrapper.clientWidth;
      const h = wrapper.clientHeight;
      const pins = getPinsForChar(currentChar);

      pins.forEach(pin => {
        const div = document.createElement('div');
        div.className = 'order-pin';
        div.innerText = pin.n;
        div.style.left = `${pin.x * w - 14}px`;
        div.style.top = `${pin.y * h - 14}px`;
        pinsContainer.appendChild(div);
      });
    }

    function resizeCanvases() {
      const rect = wrapper.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 2;
      
      drawCanvas.width = rect.width * dpr;
      drawCanvas.height = rect.height * dpr;
      drawCanvas.style.width = `${rect.width}px`;
      drawCanvas.style.height = `${rect.height}px`;

      drawCtx.setTransform(1, 0, 0, 1, 0, 0);
      drawCtx.scale(dpr, dpr);
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
      drawCtx.lineWidth = Math.max(rect.width * 0.08, 22);

      updateGuide();
    }

    /* ========================================================
       4. なぞり描き操作
       ======================================================== */
    let lastX = 0;
    let lastY = 0;

    function getCoords(e) {
      const rect = drawCanvas.getBoundingClientRect();
      const t = (e.touches && e.touches.length > 0) ? e.touches[0] : (e.changedTouches ? e.changedTouches[0] : e);
      return {
        x: t.clientX - rect.left,
        y: t.clientY - rect.top
      };
    }

    function startDraw(e) {
      e.preventDefault();
      e.stopPropagation();
      isDrawing = true;
      const p = getCoords(e);
      lastX = p.x;
      lastY = p.y;
      sound.playPop(520);
      drawDot(p.x, p.y);
    }

    function drawDot(x, y) {
      applyStrokeStyle();
      drawCtx.beginPath();
      drawCtx.arc(x, y, drawCtx.lineWidth / 2, 0, Math.PI * 2);
      drawCtx.fill();
    }

    function moveDraw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      e.stopPropagation();
      const p = getCoords(e);

      applyStrokeStyle();
      drawCtx.beginPath();
      drawCtx.moveTo(lastX, lastY);
      drawCtx.lineTo(p.x, p.y);
      drawCtx.stroke();

      lastX = p.x;
      lastY = p.y;
    }

    function endDraw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      e.stopPropagation();
      isDrawing = false;
    }

    function applyStrokeStyle() {
      if (currentColor === 'rainbow') {
        rainbowHue = (rainbowHue + 4) % 360;
        drawCtx.strokeStyle = `hsl(${rainbowHue}, 85%, 55%)`;
        drawCtx.fillStyle = `hsl(${rainbowHue}, 85%, 55%)`;
      } else {
        drawCtx.strokeStyle = currentColor;
        drawCtx.fillStyle = currentColor;
      }
    }

    drawCanvas.addEventListener('touchstart', startDraw, { passive: false });
    drawCanvas.addEventListener('touchmove', moveDraw, { passive: false });
    drawCanvas.addEventListener('touchend', endDraw, { passive: false });
    drawCanvas.addEventListener('touchcancel', endDraw, { passive: false });

    drawCanvas.addEventListener('mousedown', startDraw);
    window.addEventListener('mousemove', moveDraw);
    window.addEventListener('mouseup', endDraw);

    /* ========================================================
       5. 達成演出（花丸右上 ＋ スプランキー目玉）
       ======================================================== */
    const rewardOverlay = document.getElementById('reward-overlay');
    const confettiContainer = document.getElementById('confetti-container');

    function triggerSuccess() {
      sound.playFanfare();
      rewardOverlay.classList.add('active');
      createConfetti();

      drawCanvas.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
      drawCanvas.style.transform = 'scale(1.04) translateY(-4px)';

      setTimeout(() => {
        drawCanvas.style.transform = 'scale(1) translateY(0)';
      }, 500);

      setTimeout(() => {
        rewardOverlay.classList.remove('active');
        confettiContainer.innerHTML = '';
      }, 4000);
    }

    function createConfetti() {
      confettiContainer.innerHTML = '';
      const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#9b59b6', '#e056fd'];
      for (let i = 0; i < 40; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-particle';
        piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        piece.style.left = `${Math.random() * 95}%`;
        piece.style.top = `${-10 - Math.random() * 20}%`;
        piece.style.animationDelay = `${Math.random() * 0.4}s`;
        piece.style.transform = `scale(${0.6 + Math.random() * 0.6})`;
        confettiContainer.appendChild(piece);
      }
    }

    /* ========================================================
       6. パレット & アクション
       ======================================================== */
    document.querySelectorAll('.color-swatch').forEach(swatch => {
      swatch.addEventListener('click', () => {
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
        currentColor = swatch.getAttribute('data-color');
        sound.playPop(740);
      });
    });

    function clearCanvas() {
      drawCtx.clearRect(0, 0, wrapper.clientWidth, wrapper.clientHeight);
      rewardOverlay.classList.remove('active');
      confettiContainer.innerHTML = '';
    }

    document.getElementById('btn-clear').addEventListener('click', () => {
      sound.playPop(320);
      clearCanvas();
    });

    document.getElementById('btn-check').addEventListener('click', () => {
      triggerSuccess();
    });

    /* ========================================================
       7. ワンタップ保存処理
       ======================================================== */
    document.getElementById('btn-save-html').addEventListener('click', () => {
      sound.playPop(880);
      const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    window.addEventListener('resize', resizeCanvases);
    window.addEventListener('DOMContentLoaded', () => {
      renderCharSelector();
      resizeCanvases();
    });
