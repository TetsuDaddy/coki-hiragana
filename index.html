  <script>
    class SoundEngine {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      playPop(freq = 480) {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.6, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.09);
      }
      playFanfare() {
        this.init();
        const now = this.ctx.currentTime;
        const notes = [
          { f: 523.25, d: 0.12 }, { f: 587.33, d: 0.12 },
          { f: 659.25, d: 0.12 }, { f: 698.46, d: 0.12 },
          { f: 783.99, d: 0.35 }, { f: 659.25, d: 0.15 }, { f: 1046.5, d: 0.6 }
        ];
        let cursor = now;
        notes.forEach((n, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = (i === notes.length - 1) ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(n.f, cursor);
          gain.gain.setValueAtTime(0.28, cursor);
          gain.gain.exponentialRampToValueAtTime(0.001, cursor + n.d);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(cursor);
          osc.stop(cursor + n.d);
          cursor += n.d * 0.85;
        });
      }
      playTryAgain() {
        this.init();
        const now = this.ctx.currentTime;
        [440, 392].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const startTime = now + idx * 0.14;
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.22, startTime);
          gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.13);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.14);
        });
      }
      playMagic() {
        this.init();
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          const startTime = now + idx * 0.08;
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.2, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.25);
        });
      }
    }

    const sound = new SoundEngine();

    const CHAR_SETS = {
      hiragana: "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん".split(""),
      katakana: "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン".split(""),
      dakuten: "がぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポ".split(""),
      suuji: Array.from({ length: 101 }, (_, i) => String(i))

    const SPECIAL_PINS = {

      'い': [{ x: 0.28, y: 0.26 }, { x: 0.72, y: 0.36 }],

      'え': [{ x: 0.46, y: 0.20 }, { x: 0.28, y: 0.40 }],
      'お': [{ x: 0.20, y: 0.30 }, { x: 0.46, y: 0.20 }, { x: 0.74, y: 0.30 }],
      'か': [{ x: 0.26, y: 0.28 }, { x: 0.48, y: 0.22 }, { x: 0.74, y: 0.25 }],
      'き': [{ x: 0.28, y: 0.30 }, { x: 0.26, y: 0.45 }, { x: 0.50, y: 0.18 }, { x: 0.36, y: 0.65 }],
      'さ': [{ x: 0.28, y: 0.32 }, { x: 0.52, y: 0.20 }, { x: 0.36, y: 0.65 }],
      'た': [{ x: 0.22, y: 0.34 }, { x: 0.38, y: 0.22 }, { x: 0.56, y: 0.40 }, { x: 0.54, y: 0.62 }],
      'な': [{ x: 0.24, y: 0.32 }, { x: 0.38, y: 0.22 }, { x: 0.64, y: 0.30 }, { x: 0.58, y: 0.55 }]
    };

    let currentMode = 'hiragana';
    let currentChar = 'あ';
    let currentColor = '#ff4757';
    let currentBrushSize = 'md';
    let isDrawing = false;
    let rainbowHue = 0;
    let hasDrawnAnyLine = false;

    /* ★お絵描き一時キャッシュ用キャンバス（ブラウザ再読み込みまで保持）★ */
    let oekakiBufferCanvas = null;
    let hasSavedOekaki = false;

    let activeMixerSlot = 'slot-1';
    let mixerColor1 = '#ff4757';
    let mixerColor2 = '#1e90ff';

    const wrapper = document.getElementById('canvas-card');
    const drawCanvas = document.getElementById('draw-canvas');
    const drawCtx = drawCanvas.getContext('2d');
    const guideText = document.getElementById('guide-text');
    const pinsContainer = document.getElementById('order-pins-container');
    const charScrollBar = document.getElementById('char-scroll-bar');
    const gridLines = document.getElementById('grid-lines');
    const rewardOverlay = document.getElementById('reward-overlay');
    const tryAgainBubble = document.getElementById('try-again-bubble');
    const confettiContainer = document.getElementById('confetti-container');

    const oekakiPalette = document.getElementById('oekaki-palette');
    const normalPalette = document.getElementById('normal-palette');
    const colorMixerToolbar = document.getElementById('color-mixer-toolbar');
    const downloadBar = document.getElementById('download-bar');
    const btnCheck = document.getElementById('btn-check');

    const slot1 = document.getElementById('slot-1');
    const slot2 = document.getElementById('slot-2');

    const imageFileInput = document.getElementById('image-file-input');
    const btnLoadImage = document.getElementById('btn-load-image');

    /* 画像読み込みボタンの連携 */
    btnLoadImage.addEventListener('click', () => {
      sound.playPop(580);
      imageFileInput.click();
    });

    imageFileInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          // キャンバスのサイズに合わせて中央配置・比率維持で描画
          const rect = wrapper.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;
          const canvasW = drawCanvas.width;
          const canvasH = drawCanvas.height;

          // アスペクト比を保ちつつ、キャンバス内に収まるサイズを計算
          const scale = Math.min(canvasW / img.width, canvasH / img.height);
          const drawW = img.width * scale;
          const drawH = img.height * scale;
          const offsetX = (canvasW - drawW) / 2;
          const offsetY = (canvasH - drawH) / 2;

          drawCtx.save();
          drawCtx.setTransform(1, 0, 0, 1, 0, 0);
          drawCtx.drawImage(img, offsetX, offsetY, drawW, drawH);
          drawCtx.restore();

          hasDrawnAnyLine = true;
          saveOekakiToBuffer(); // 読み込んだ絵を一時保存バッファにも反映
          sound.playMagic();
          imageFileInput.value = ''; // 次回同じファイルを選べるようにリセット
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    /* 一時バッファにお絵描きを保存する */
    function saveOekakiToBuffer() {
      if (currentMode !== 'oekaki' || !hasDrawnAnyLine) return;
      if (!oekakiBufferCanvas) {
        oekakiBufferCanvas = document.createElement('canvas');
      }
      oekakiBufferCanvas.width = drawCanvas.width;
      oekakiBufferCanvas.height = drawCanvas.height;
      const bCtx = oekakiBufferCanvas.getContext('2d');
      bCtx.clearRect(0, 0, oekakiBufferCanvas.width, oekakiBufferCanvas.height);
      bCtx.drawImage(drawCanvas, 0, 0);
      hasSavedOekaki = true;
    }

    /* 一時バッファからお絵描きを復元する */
    function restoreOekakiFromBuffer() {
      if (hasSavedOekaki && oekakiBufferCanvas) {
        drawCtx.save();
        drawCtx.setTransform(1, 0, 0, 1, 0, 0);
        drawCtx.drawImage(oekakiBufferCanvas, 0, 0, drawCanvas.width, drawCanvas.height);
        drawCtx.restore();
        hasDrawnAnyLine = true;
      }
    }

    function updateMixerSlotUI() {
      slot1.style.backgroundColor = mixerColor1;
      slot2.style.backgroundColor = mixerColor2;
      slot1.classList.toggle('target-active', activeMixerSlot === 'slot-1');
      slot2.classList.toggle('target-active', activeMixerSlot === 'slot-2');
    }

    slot1.addEventListener('click', () => {
      activeMixerSlot = 'slot-1';
      sound.playPop(550);
      updateMixerSlotUI();
    });

    slot2.addEventListener('click', () => {
      activeMixerSlot = 'slot-2';
      sound.playPop(550);
      updateMixerSlotUI();
    });

    function hexToRgb(hex) {
      hex = hex.replace(/^#/, '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const num = parseInt(hex, 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function rgbToHex(r, g, b) {
      return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    function blendColors(c1, c2) {
      const rgb1 = hexToRgb(c1);
      const rgb2 = hexToRgb(c2);
      const r = Math.round((rgb1.r + rgb2.r) / 2);
      const g = Math.round((rgb1.g + rgb2.g) / 2);
      const b = Math.round((rgb1.b + rgb2.b) / 2);
      return rgbToHex(r, g, b);
    }

    btnMixColors.addEventListener('click', () => {
      sound.playMagic();
      const blendedHex = blendColors(mixerColor1, mixerColor2);

      const newSwatch = document.createElement('div');
      newSwatch.className = 'color-swatch active';
      newSwatch.style.backgroundColor = blendedHex;
      newSwatch.setAttribute('data-color', blendedHex);
      newSwatch.title = `まぜた色 (${blendedHex})`;

      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      oekakiPalette.prepend(newSwatch);

      attachSwatchEvent(newSwatch);
      currentColor = blendedHex;
      applyStrokeStyle();
      oekakiPalette.scrollLeft = 0;
    });

    function updateBrushLineWidth() {
      let width = 14;
      if (currentMode === 'oekaki') {
        if (currentBrushSize === 'sm') width = 6;
        else if (currentBrushSize === 'md') width = 12;
        else if (currentBrushSize === 'lg') width = 24;
      } else {
        if (currentBrushSize === 'sm') width = 10;
        else if (currentBrushSize === 'md') width = 18;
        else if (currentBrushSize === 'lg') width = 28;
      }
      drawCtx.lineWidth = width;
    }

    document.querySelectorAll('.btn-brush-size').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btn-brush-size').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentBrushSize = btn.getAttribute('data-size');
        sound.playPop(620);
        updateBrushLineWidth();
      });
    });

    function getDrawnCanvasSnapshot() {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = 1200;
      exportCanvas.height = 1200;
      const ctx = exportCanvas.getContext('2d');

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, 1200, 1200);

      ctx.strokeStyle = '#f1f5f9';
      ctx.lineWidth = 4;
      ctx.setLineDash([12, 12]);
      ctx.beginPath();
      ctx.moveTo(600, 0); ctx.lineTo(600, 1200);
      ctx.moveTo(0, 600); ctx.lineTo(1200, 600);
      ctx.stroke();
      ctx.setLineDash([]);

      if (currentMode !== 'oekaki') {
        ctx.fillStyle = '#cbd5e1';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        let fSize = 750;
        if (currentChar.length === 2) fSize = 480;
        if (currentChar.length >= 3) fSize = 320;
        ctx.font = `900 ${fSize}px -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", sans-serif`;
        ctx.fillText(currentChar, 600, 620);
      }

      ctx.drawImage(drawCanvas, 0, 0, drawCanvas.width, drawCanvas.height, 0, 0, 1200, 1200);
      return exportCanvas;
    }

    document.getElementById('btn-download-png').addEventListener('click', () => {
      sound.playPop(680);
      const snapshot = getDrawnCanvasSnapshot();
      const url = snapshot.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = `coki_おえかき_${new Date().toISOString().slice(0,10)}.png`;
      a.click();
    });

    document.getElementById('btn-download-pdf').addEventListener('click', () => {
      sound.playPop(680);
      const snapshot = getDrawnCanvasSnapshot();
      const printSheetArea = document.getElementById('print-sheet-area');
      printSheetArea.innerHTML = '';
      const img = document.createElement('img');
      img.src = snapshot.toDataURL('image/png');
      printSheetArea.appendChild(img);
      printSheetArea.style.display = 'flex';

      setTimeout(() => {
        window.print();
        setTimeout(() => {
          printSheetArea.style.display = 'none';
          printSheetArea.innerHTML = '';
        }, 800);
      }, 250);
    });

    function resizeCanvases() {
      const rect = wrapper.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      drawCanvas.width = Math.round(rect.width * dpr);
      drawCanvas.height = Math.round(rect.height * dpr);
      drawCanvas.style.width = `${rect.width}px`;
      drawCanvas.style.height = `${rect.height}px`;

      drawCtx.setTransform(1, 0, 0, 1, 0, 0);
      drawCtx.scale(dpr, dpr);
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
      updateBrushLineWidth();
      applyStrokeStyle();

      if (currentMode === 'oekaki') {
        restoreOekakiFromBuffer();
      } else {
        renderPins();
      }
    }

    function initCharScroll() {
      charScrollBar.innerHTML = '';
      if (currentMode === 'oekaki') {
        return;
      }
      const list = CHAR_SETS[currentMode] || [];
      list.forEach((ch, idx) => {
        const pill = document.createElement('div');
        pill.className = `char-pill ${ch === currentChar ? 'active' : ''}`;
        pill.innerText = ch;
        pill.addEventListener('click', () => {
          document.querySelectorAll('.char-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          currentChar = ch;
          sound.playPop(600);
          resetCurrentPractice();
        });
        charScrollBar.appendChild(pill);
        if (idx === 0 && !list.includes(currentChar)) {
          currentChar = ch;
          pill.classList.add('active');
        }
      });
    }

    function resetCurrentPractice() {
      clearCanvas(false); /* 一時バッファは消さずに現在のキャンバスを消去 */
      guideText.innerText = (currentMode === 'oekaki') ? '' : currentChar;
      
      let fontSize = '220px';
      if (currentChar.length === 2) fontSize = '140px';
      if (currentChar.length >= 3) fontSize = '95px';
      guideText.style.fontSize = fontSize;

      if (currentMode === 'oekaki') {
        pinsContainer.innerHTML = '';
      } else {
        renderPins();
      }
    }

    function renderPins() {
      pinsContainer.innerHTML = '';
      if (currentMode === 'oekaki') return;

      const w = wrapper.clientWidth;
      const h = wrapper.clientHeight;
      let pins = SPECIAL_PINS[currentChar];

      if (!pins) {
        if (currentChar.length > 1) {
          pins = [];
          const step = 1 / (currentChar.length + 1);
          for (let i = 0; i < currentChar.length; i++) {
            pins.push({ x: step * (i + 1), y: 0.28 });
          }
        } else {
          pins = [{ x: 0.5, y: 0.25 }, { x: 0.32, y: 0.5 }];
        }
      }

      pins.forEach((p, idx) => {
        const div = document.createElement('div');
        div.className = 'order-pin';
        div.id = `pin-${idx}`;
        div.innerText = idx + 1;
        div.style.left = `${p.x * w - 14}px`;
        div.style.top = `${p.y * h - 14}px`;
        pinsContainer.appendChild(div);
      });
    }

    let activePinsPassed = new Set();

    function checkPinHit(touchX, touchY) {
      if (currentMode === 'oekaki') return;
      const w = wrapper.clientWidth;
      const h = wrapper.clientHeight;
      let pins = SPECIAL_PINS[currentChar];
      if (!pins) {
        if (currentChar.length > 1) {
          pins = [];
          const step = 1 / (currentChar.length + 1);
          for (let i = 0; i < currentChar.length; i++) {
            pins.push({ x: step * (i + 1), y: 0.28 });
          }
        } else {
          pins = [{ x: 0.5, y: 0.25 }, { x: 0.32, y: 0.5 }];
        }
      }

      pins.forEach((p, idx) => {
        if (activePinsPassed.has(idx)) return;
        const px = p.x * w;
        const py = p.y * h;
        const dist = Math.hypot(touchX - px, touchY - py);
        if (dist < 32) {
          activePinsPassed.add(idx);
          const pinEl = document.getElementById(`pin-${idx}`);
          if (pinEl) {
            pinEl.classList.add('passed');
            sound.playPop(750 + idx * 80);
          }
        }
      });
    }

    let lastX = 0;
    let lastY = 0;

    function getCoords(e) {
      const rect = drawCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDraw(e) {
      isDrawing = true;
      hasDrawnAnyLine = true;
      const p = getCoords(e);
      lastX = p.x;
      lastY = p.y;
      sound.playPop(520);
      drawDot(p.x, p.y);
      checkPinHit(p.x, p.y);
    }

    function drawDot(x, y) {
      applyStrokeStyle();
      drawCtx.beginPath();
      drawCtx.arc(x, y, drawCtx.lineWidth / 2, 0, Math.PI * 2);
      drawCtx.fill();
    }

    function moveDraw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const p = getCoords(e);

      applyStrokeStyle();
      drawCtx.beginPath();
      drawCtx.moveTo(lastX, lastY);
      drawCtx.lineTo(p.x, p.y);
      drawCtx.stroke();

      checkPinHit(p.x, p.y);
      lastX = p.x;
      lastY = p.y;
    }

    function endDraw() {
      isDrawing = false;
      if (currentMode === 'oekaki') {
        saveOekakiToBuffer(); /* 一筆描くごとに自動で一時バッファを更新 */
      }
    }

    function applyStrokeStyle() {
      if (currentColor === 'rainbow') {
        rainbowHue = (rainbowHue + 4) % 360;
        drawCtx.strokeStyle = `hsl(${rainbowHue}, 90%, 55%)`;
        drawCtx.fillStyle = `hsl(${rainbowHue}, 90%, 55%)`;
      } else {
        drawCtx.strokeStyle = currentColor;
        drawCtx.fillStyle = currentColor;
      }
    }

    drawCanvas.addEventListener('mousedown', startDraw);
    window.addEventListener('mousemove', moveDraw);
    window.addEventListener('mouseup', endDraw);

    drawCanvas.addEventListener('touchstart', startDraw, { passive: false });
    window.addEventListener('touchmove', moveDraw, { passive: false });
    window.addEventListener('touchend', endDraw);

    function evaluateTracingQuality() {
      if (currentMode === 'oekaki') return true;
      if (!hasDrawnAnyLine) return false;

      let totalPins = 2;
      if (SPECIAL_PINS[currentChar]) {
        totalPins = SPECIAL_PINS[currentChar].length;
      } else if (currentChar.length > 1) {
        totalPins = currentChar.length;
      }

      const passedCount = activePinsPassed.size;
      let isPinSatisfied = false;
      if (totalPins <= 2) {
        isPinSatisfied = (passedCount === totalPins);
      } else {
        isPinSatisfied = (passedCount >= totalPins);
      }

      return isPinSatisfied;
    }

    function triggerSuccess() {
      sound.playFanfare();
      rewardOverlay.style.display = 'block';
      setTimeout(() => rewardOverlay.classList.add('active'), 10);
      createConfetti();

      drawCanvas.style.transition = 'transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
      drawCanvas.style.transform = 'scale(1.04) translateY(-4px)';

      setTimeout(() => {
        drawCanvas.style.transform = 'scale(1) translateY(0)';
      }, 400);

      setTimeout(() => {
        rewardOverlay.classList.remove('active');
        setTimeout(() => {
          rewardOverlay.style.display = 'none';
          confettiContainer.innerHTML = '';
        }, 300);
      }, 3800);
    }

    function triggerTryAgain() {
      sound.playTryAgain();
      tryAgainBubble.classList.add('active');
      setTimeout(() => {
        tryAgainBubble.classList.remove('active');
      }, 2000);
    }

    function createConfetti() {
      confettiContainer.innerHTML = '';
      const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#9b59b6', '#ff6b81'];
      for (let i = 0; i < 35; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-particle';
        piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        piece.style.left = `${Math.random() * 95}%`;
        piece.style.top = `${-10 - Math.random() * 20}%`;
        piece.style.animationDelay = `${Math.random() * 0.4}s`;
        piece.style.transform = `scale(${0.6 + Math.random() * 0.6})`;
        confettiContainer.appendChild(piece);
      }
    }

    function clearCanvas(clearBuffer = false) {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      rewardOverlay.classList.remove('active');
      rewardOverlay.style.display = 'none';
      tryAgainBubble.classList.remove('active');
      confettiContainer.innerHTML = '';
      hasDrawnAnyLine = false;
      activePinsPassed.clear();
      document.querySelectorAll('.order-pin').forEach(pin => pin.classList.remove('passed'));

      if (clearBuffer && currentMode === 'oekaki') {
        hasSavedOekaki = false;
        if (oekakiBufferCanvas) {
          const bCtx = oekakiBufferCanvas.getContext('2d');
          bCtx.clearRect(0, 0, oekakiBufferCanvas.width, oekakiBufferCanvas.height);
        }
      }
    }

    /* ゴミ箱ボタンを押した時は一時保存も含めて完全消去 */
    document.getElementById('btn-clear').addEventListener('click', () => {
      sound.playPop(320);
      clearCanvas(true);
    });

    btnCheck.addEventListener('click', () => {
      if (evaluateTracingQuality()) {
        triggerSuccess();
      } else {
        triggerTryAgain();
      }
    });

    function attachSwatchEvent(swatch) {
      swatch.addEventListener('click', () => {
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
        const col = swatch.getAttribute('data-color');
        currentColor = col;
        sound.playPop(740);

        if (currentMode === 'oekaki' && col !== 'rainbow') {
          if (activeMixerSlot === 'slot-1') {
            mixerColor1 = col;
            activeMixerSlot = 'slot-2';
          } else {
            mixerColor2 = col;
            activeMixerSlot = 'slot-1';
          }
          updateMixerSlotUI();
        }
      });
    }

    document.querySelectorAll('.color-swatch').forEach(attachSwatchEvent);
    updateMixerSlotUI();

    /* ★モードタブ切り替え★ */
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        /* 他のタブに移る直前に、お絵描きモード中なら現在の絵をバッファへ退避保存 */
        if (currentMode === 'oekaki') {
          saveOekakiToBuffer();
        }

        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.getAttribute('data-mode');
        sound.playPop(620);

        /* お絵描きモードのUI表示分け */
        if (currentMode === 'oekaki') {
          document.body.classList.add('is-oekaki');
          wrapper.classList.add('fullscreen-mode');
          gridLines.style.display = 'none';
          normalPalette.style.display = 'none';
          oekakiPalette.style.display = 'flex';
          colorMixerToolbar.style.display = 'flex';
          downloadBar.style.display = 'flex';
          btnCheck.style.display = 'none';
        } else {
          document.body.classList.remove('is-oekaki');
          wrapper.classList.remove('fullscreen-mode');
          gridLines.style.display = 'block';
          normalPalette.style.display = 'flex';
          oekakiPalette.style.display = 'none';
          colorMixerToolbar.style.display = 'none';
          downloadBar.style.display = 'none';
          btnCheck.style.display = 'inline-flex';
          
          const defaultList = CHAR_SETS[currentMode] || [];
          currentChar = defaultList[0] || 'あ';
        }

        initCharScroll();
        resetCurrentPractice();

        requestAnimationFrame(() => {
          resizeCanvases();
        });
      });
    });

    document.getElementById('btn-save-file').addEventListener('click', () => {
      sound.playPop(700);
      const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "index.html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    window.addEventListener('resize', () => {
      resizeCanvases();
    });

    window.addEventListener('DOMContentLoaded', () => {
      initCharScroll();
      resetCurrentPractice();
      resizeCanvases();
    });
  </script>

</body></html>
