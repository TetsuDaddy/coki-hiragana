    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playPop(freq = 520) {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.6, this.ctx.currentTime + 0.08);

        gain.gain.setValueAtTime(0.24, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.09);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      }
      playMixMagic() {
        this.init();
        const now = this.ctx.currentTime;
        const freqs = [440, 554.37, 659.25, 880, 1108.73];
        freqs.forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now + i * 0.05);
          gain.gain.setValueAtTime(0.2, now + i * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.05);
          osc.stop(now + i * 0.05 + 0.26);
        });
      }
      playTryAgain() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(523.25, now + 0.12);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.36);
      }
      playFanfare() {
        this.init();
        const now = this.ctx.currentTime;
        const notes = [
          { f: 523.25, d: 0.11 },
          { f: 587.33, d: 0.11 },
          { f: 659.25, d: 0.11 },
          { f: 698.46, d: 0.11 },
          { f: 783.99, d: 0.32 },
          { f: 659.25, d: 0.13 },
          { f: 1046.5, d: 0.55 }
        ];
        let cursor = now;
        notes.forEach((n, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = (i === notes.length - 1) ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(n.f, cursor);
          gain.gain.setValueAtTime(0.28, cursor);
          gain.gain.exponentialRampToValueAtTime(0.001, cursor + n.d);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(cursor);
          osc.stop(cursor + n.d);
          cursor += n.d * 0.85;
        });
      }

      'み': [{ n:'1', x:0.26, y:0.32 }, { n:'2', x:0.64, y:0.36 }],
      'む': [{ n:'1', x:0.24, y:0.34 }, { n:'2', x:0.46, y:0.22 }, { n:'3', x:0.74, y:0.30 }],

      'ゆ': [{ n:'1', x:0.38, y:0.26 }, { n:'2', x:0.64, y:0.20 }],
      'よ': [{ n:'1', x:0.30, y:0.34 }, { n:'2', x:0.58, y:0.22 }],
      'ら': [{ n:'1', x:0.46, y:0.20 }, { n:'2', x:0.34, y:0.40 }],

      'る': [{ n:'1', x:0.30, y:0.28 }, { n:'2', x:0.50, y:0.70 }],
      'れ': [{ n:'1', x:0.32, y:0.24 }, { n:'2', x:0.24, y:0.36 }],
      'ろ': [{ n:'1', x:0.30, y:0.28 }, { n:'2', x:0.50, y:0.70 }],
      'わ': [{ n:'1', x:0.32, y:0.24 }, { n:'2', x:0.24, y:0.36 }],
      'を': [{ n:'1', x:0.24, y:0.32 }, { n:'2', x:0.42, y:0.22 }, { n:'3', x:0.32, y:0.62 }],
      'ん': [{ n:'1', x:0.30, y:0.26 }, { n:'2', x:0.55, y:0.65 }]
    };

    const DAKUTEN_PARENT_MAP = {
      'が':'か','ぎ':'き','ぐ':'く','げ':'け','ご':'こ',
      'ざ':'さ','じ':'し','ず':'す','ぜ':'せ','ぞ':'そ',
      'だ':'た','ぢ':'ち','づ':'つ','で':'て','ど':'と',
      'ば':'は','び':'ひ','ぶ':'ふ','べ':'へ','ぼ':'ほ',
      'ぱ':'は','ぴ':'ひ','ぷ':'ふ','ペ':'へ','ぽ':'ほ',
      'ガ':'カ','ギ':'キ','グ':'ク','ゲ':'ケ','ゴ':'コ',
      'ザ':'サ','ジ':'シ','ズ':'ス','ゼ':'セ','ゾ':'ソ',
      'ダ':'タ','ヂ':'チ','ヅ':'ツ','デ':'テ','ド':'ト',
      'バ':'ハ','ビ':'ヒ','ブ':'フ','ベ':'ヘ','ボ':'ホ',
      'パ':'ハ','ピ':'ヒ','プ':'フ','ペ':'ヘ','ポ':'ホ'
    };

    function getPinsForChar(c) {
      if (PINS_MAP[c]) return PINS_MAP[c];

      if (/^\d+$/.test(c)) {
        const digits = c.split('');
        const pins = [];
        const count = digits.length;
        let globalPinIndex = 1;

        digits.forEach((d, idx) => {
          const slotWidth = 1 / count;
          const slotStartX = idx * slotWidth;
          const basePins = SINGLE_DIGIT_PINS[d] || [{ n:'1', x:0.5, y:0.3 }];

          basePins.forEach(bp => {
            pins.push({
              n: (globalPinIndex++).toString(),
              x: slotStartX + (bp.x * slotWidth),
              y: bp.y
            });
          });
        });
        return pins;
      }

      if (DAKUTEN_PARENT_MAP[c]) {
        const base = DAKUTEN_PARENT_MAP[c];
        const basePins = PINS_MAP[base] ? JSON.parse(JSON.stringify(PINS_MAP[base])) : [{ n:'1', x:0.3, y:0.3 }];
        const count = basePins.length;
        const isHandakuten = 'ぱぴぷぺぽパピプペポ'.includes(c);
        if (isHandakuten) {
          basePins.push({ n: (count + 1).toString(), x: 0.78, y: 0.20 });
        } else {
          basePins.push({ n: (count + 1).toString(), x: 0.72, y: 0.20 });
          basePins.push({ n: (count + 2).toString(), x: 0.82, y: 0.24 });
        }
        return basePins;
      }

      return [{ n: '1', x: 0.32, y: 0.26 }, { n: '2', x: 0.50, y: 0.70 }];
    }

    let currentMode = 'hiragana';
    let currentChar = 'あ';
    let currentColor = '#ff4757';
    let currentBrushSize = 'md';
    let isDrawing = false;
    let hasStamped = false;
    let rainbowHue = 0;

    let activePinsStatus = [];

    const wrapper = document.getElementById('canvas-card');
    const guideText = document.getElementById('guide-text');
    const gridLines = document.getElementById('grid-lines');
    const drawCanvas = document.getElementById('draw-canvas');
    const drawCtx = drawCanvas.getContext('2d');
    const pinsContainer = document.getElementById('order-pins-container');
    const scrollBar = document.getElementById('char-scroll-bar');
    const downloadBar = document.getElementById('download-bar');
    const tryAgainBubble = document.getElementById('try-again-bubble');
    const standardPalette = document.getElementById('standard-palette');
    const oekakiPalette = document.getElementById('oekaki-palette');
    const colorMixerToolbar = document.getElementById('color-mixer-toolbar');

    function updateBrushLineWidth() {
      const sizeMap = {
        sm: currentMode === 'oekaki' ? 6 : 10,
        md: currentMode === 'oekaki' ? 14 : 18,
        lg: currentMode === 'oekaki' ? 26 : 28
      };
      drawCtx.lineWidth = sizeMap[currentBrushSize] || 14;
    }

    document.querySelectorAll('.btn-brush-size').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btn-brush-size').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentBrushSize = btn.getAttribute('data-size');
        sound.playPop(580);
        updateBrushLineWidth();
      });
    });

    let activeSlotTarget = 1;
    let slotColor1 = '#ff4757';
    let slotColor2 = '#1e90ff';
    const slotEl1 = document.getElementById('slot-1');
    const slotEl2 = document.getElementById('slot-2');

    function updateMixerSlotUI() {
      if (slotEl1) {
        slotEl1.style.backgroundColor = slotColor1;
        slotEl1.classList.toggle('target-active', activeSlotTarget === 1);
      }
      if (slotEl2) {
        slotEl2.style.backgroundColor = slotColor2;
        slotEl2.classList.toggle('target-active', activeSlotTarget === 2);
      }
    }
    updateMixerSlotUI();

    slotEl1.addEventListener('click', () => {
      activeSlotTarget = 1;
      sound.playPop(620);
      updateMixerSlotUI();
    });

    slotEl2.addEventListener('click', () => {
      activeSlotTarget = 2;
      sound.playPop(680);
      updateMixerSlotUI();
    });

    function renderCharSelector() {
      scrollBar.innerHTML = '';
      if (currentMode === 'oekaki') {
        scrollBar.style.display = 'none';
        return;
      }
      scrollBar.style.display = 'flex';

      const list = CHAR_SETS[currentMode];
      list.forEach(c => {
        const btn = document.createElement('button');
        btn.className = `char-pill ${c === currentChar ? 'active' : ''}`;
        btn.innerText = c;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.char-pill').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentChar = c;
          sound.playPop(620);
          updateGuide();
          clearCanvas();
        });
        scrollBar.appendChild(btn);
      });
    }

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.getAttribute('data-mode');
        
        const btnCheck = document.getElementById('btn-check');
        const rewardOverlay = document.getElementById('reward-overlay');
        const gridLines = document.getElementById('grid-lines');

        if (currentMode === 'oekaki') {
          document.body.classList.add('is-oekaki');
          currentChar = '';
          wrapper.classList.add('fullscreen-mode');
          gridLines.style.display = 'none';
          downloadBar.style.display = 'flex';
          standardPalette.style.display = 'none';
          oekakiPalette.style.display = 'flex';
          colorMixerToolbar.style.display = 'flex';
          btnCheck.style.display = 'none';
          rewardOverlay.style.display = 'none';
          pinsContainer.innerHTML = '';
        } else {
          document.body.classList.remove('is-oekaki');

          downloadBar.style.display = 'none';
          standardPalette.style.display = 'flex';

          colorMixerToolbar.style.display = 'none';
          btnCheck.style.display = 'inline-flex';
          rewardOverlay.style.display = 'block';
        }

        sound.playPop(700);
        renderCharSelector();

        requestAnimationFrame(() => {
          resizeCanvases();
          setTimeout(resizeCanvases, 80);
        });

        clearCanvas();
      });
    });

    function updateGuide() {
      pinsContainer.innerHTML = '';
      activePinsStatus = [];

      if (currentMode === 'oekaki') {
        guideText.style.display = 'none';
        gridLines.style.display = 'none';
        return;
      }

      guideText.style.display = 'flex';
      gridLines.style.display = 'block';
      guideText.innerText = currentChar;

      if (currentChar.length >= 3) {
        guideText.style.fontSize = '95px';
        guideText.style.letterSpacing = '-4px';
      } else if (currentChar.length === 2) {
        guideText.style.fontSize = '145px';
        guideText.style.letterSpacing = '-3px';
      } else {
        guideText.style.fontSize = '220px';
        guideText.style.letterSpacing = '-2px';
      }

      const w = wrapper.clientWidth;
      const h = wrapper.clientHeight;
      const pins = getPinsForChar(currentChar);

      pins.forEach((pin, index) => {
        const px = pin.x * w;
        const py = pin.y * h;
        
        const div = document.createElement('div');
        div.className = 'order-pin';
        div.id = `pin-${index}`;
        div.innerText = pin.n;
        div.style.left = `${px - 14}px`;
        div.style.top = `${py - 14}px`;
        pinsContainer.appendChild(div);

        activePinsStatus.push({
          x: px,
          y: py,
          passed: false,
          el: div
        });
      });
    }

    function resizeCanvases() {
      const rect = wrapper.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 2;
      
      let tempCanvas = null;
      if (drawCanvas.width > 0 && drawCanvas.height > 0) {
        tempCanvas = document.createElement('canvas');
        tempCanvas.width = drawCanvas.width;
        tempCanvas.height = drawCanvas.height;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(drawCanvas, 0, 0);
      }

      const newWidth = Math.round(rect.width * dpr);
      const newHeight = Math.round(rect.height * dpr);

      drawCanvas.width = newWidth;
      drawCanvas.height = newHeight;
      drawCanvas.style.width = `${rect.width}px`;
      drawCanvas.style.height = `${rect.height}px`;

      drawCtx.setTransform(1, 0, 0, 1, 0, 0);
      drawCtx.scale(dpr, dpr);
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';

      if (tempCanvas) {
        drawCtx.save();
        drawCtx.setTransform(1, 0, 0, 1, 0, 0);
        drawCtx.drawImage(tempCanvas, 0, 0, newWidth, newHeight);
        drawCtx.restore();
      }

      updateBrushLineWidth();
      updateGuide();
    }

    let lastX = 0;
    let lastY = 0;

    function getCoords(e) {
      const rect = drawCanvas.getBoundingClientRect();
      const t = (e.touches && e.touches.length > 0) ? e.touches[0] : (e.changedTouches ? e.changedTouches[0] : e);
      return {
        x: t.clientX - rect.left,
        y: t.clientY - rect.top
      };
    }

    function checkPinHit(x, y) {
      if (currentMode === 'oekaki') return;
      activePinsStatus.forEach(pin => {
        if (!pin.passed) {
          const dist = Math.hypot(x - pin.x, y - pin.y);
          if (dist < 32) {
            pin.passed = true;
            if (pin.el) pin.el.classList.add('passed');
            sound.playPop(780);
          }
        }
      });
    }

    function startDraw(e) {
      e.preventDefault();
      e.stopPropagation();
      isDrawing = true;
      const p = getCoords(e);
      lastX = p.x;
      lastY = p.y;
      sound.playPop(520);
      drawDot(p.x, p.y);
      checkPinHit(p.x, p.y);
    }

    function drawDot(x, y) {
      applyStrokeStyle();
      drawCtx.beginPath();
      drawCtx.arc(x, y, drawCtx.lineWidth / 2, 0, Math.PI * 2);
      drawCtx.fill();
    }

    function moveDraw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      e.stopPropagation();
      const p = getCoords(e);

      applyStrokeStyle();
      drawCtx.beginPath();
      drawCtx.moveTo(lastX, lastY);
      drawCtx.lineTo(p.x, p.y);
      drawCtx.stroke();

      lastX = p.x;
      lastY = p.y;
      checkPinHit(p.x, p.y);
    }

    function endDraw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      e.stopPropagation();
      isDrawing = false;
    }

    function applyStrokeStyle() {
      if (currentColor === 'rainbow') {
        rainbowHue = (rainbowHue + 4) % 360;
        drawCtx.strokeStyle = `hsl(${rainbowHue}, 85%, 55%)`;
        drawCtx.fillStyle = `hsl(${rainbowHue}, 85%, 55%)`;
      } else {
        drawCtx.strokeStyle = currentColor;
        drawCtx.fillStyle = currentColor;
      }
    }

    drawCanvas.addEventListener('touchstart', startDraw, { passive: false });
    drawCanvas.addEventListener('touchmove', moveDraw, { passive: false });
    drawCanvas.addEventListener('touchend', endDraw, { passive: false });
    drawCanvas.addEventListener('touchcancel', endDraw, { passive: false });

    drawCanvas.addEventListener('mousedown', startDraw);
    window.addEventListener('mousemove', moveDraw);
    window.addEventListener('mouseup', endDraw);

    const rewardOverlay = document.getElementById('reward-overlay');
    const confettiContainer = document.getElementById('confetti-container');

    function triggerSuccess() {
      hasStamped = true;
      sound.playFanfare();
      rewardOverlay.classList.add('active');
      createConfetti();

      drawCanvas.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
      drawCanvas.style.transform = 'scale(1.04) translateY(-4px)';

      setTimeout(() => {
        drawCanvas.style.transform = 'scale(1) translateY(0)';
      }, 500);

      setTimeout(() => {
        rewardOverlay.classList.remove('active');
        confettiContainer.innerHTML = '';
      }, 4000);
    }

    function triggerTryAgain() {
      sound.playTryAgain();
      tryAgainBubble.classList.add('active');
      setTimeout(() => {
        tryAgainBubble.classList.remove('active');
      }, 2200);
    }

    function checkTracingScore() {
      if (currentMode === 'oekaki') return true;

      const totalPins = activePinsStatus.length;
      if (totalPins > 0) {
        const passedCount = activePinsStatus.filter(p => p.passed).length;
        if (totalPins === 1 && passedCount < 1) return false;
        if (totalPins === 2 && passedCount < 2) return false;
        if (totalPins === 3 && passedCount < 3) return false;
        if (totalPins >= 4 && (passedCount / totalPins) < 0.70) return false;
      }

      const w = drawCanvas.width;
      const h = drawCanvas.height;
      if (w === 0 || h === 0) return false;

      const coreX = Math.floor(w * 0.15);
      const coreY = Math.floor(h * 0.20);
      const coreW = Math.floor(w * 0.70);
      const coreH = Math.floor(h * 0.60);

      const imgData = drawCtx.getImageData(coreX, coreY, coreW, coreH).data;
      let coreDrawn = 0;
      for (let i = 3; i < imgData.length; i += 16) {
        if (imgData[i] > 20) coreDrawn++;
      }

      const minCorePixels = (coreW * coreH / 16) * 0.02;
      return coreDrawn >= minCorePixels;
    }

    function createConfetti() {
      confettiContainer.innerHTML = '';
      const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#9b59b6', '#e056fd'];
      for (let i = 0; i < 40; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-particle';
        piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        piece.style.left = `${Math.random() * 95}%`;
        piece.style.top = `${-10 - Math.random() * 20}%`;
        piece.style.animationDelay = `${Math.random() * 0.4}s`;
        piece.style.transform = `scale(${0.6 + Math.random() * 0.6})`;
        confettiContainer.appendChild(piece);
      }
    }

    function attachSwatchEvents() {
      document.querySelectorAll('.color-swatch').forEach(swatch => {
        swatch.onclick = null;
        swatch.onclick = () => {
          document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
          swatch.classList.add('active');
          const picked = swatch.getAttribute('data-color');
          currentColor = picked;
          sound.playPop(740);

          if (currentMode === 'oekaki' && picked !== 'rainbow') {
            if (activeSlotTarget === 1) {
              slotColor1 = picked;
              activeSlotTarget = 2;
            } else {
              slotColor2 = picked;
            }
            updateMixerSlotUI();
          }
        };
      });
    }
    attachSwatchEvents();

    function blendHexColors(c1, c2) {
      if (c1.startsWith('#') && c2.startsWith('#')) {
        const r1 = parseInt(c1.slice(1, 3), 16), g1 = parseInt(c1.slice(3, 5), 16), b1 = parseInt(c1.slice(5, 7), 16);
        const r2 = parseInt(c2.slice(1, 3), 16), g2 = parseInt(c2.slice(3, 5), 16), b2 = parseInt(c2.slice(5, 7), 16);
        const r = Math.floor((r1 + r2) / 2);
        const g = Math.floor((g1 + g2) / 2);
        const b = Math.floor((b1 + b2) / 2);
        return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
      }
      return '#ff4757';
    }

    document.getElementById('btn-mix-colors').addEventListener('click', () => {
      const mixedColor = blendHexColors(slotColor1, slotColor2);
      currentColor = mixedColor;
      sound.playMixMagic();

      const newSwatch = document.createElement('div');
      newSwatch.className = 'color-swatch active';
      newSwatch.style.backgroundColor = mixedColor;
      newSwatch.setAttribute('data-color', mixedColor);

      oekakiPalette.insertBefore(newSwatch, oekakiPalette.firstChild);
      attachSwatchEvents();

      slotColor1 = mixedColor;
      activeSlotTarget = 2;
      updateMixerSlotUI();

    function clearCanvas() {
      hasStamped = false;
      drawCtx.clearRect(0, 0, wrapper.clientWidth, wrapper.clientHeight);
      rewardOverlay.classList.remove('active');

    document.getElementById('btn-clear').addEventListener('click', () => {

    document.getElementById('btn-check').addEventListener('click', () => {

    function generateCombinedCanvas() {
      const exportCanvas = document.createElement('canvas');
      const size = 1200;
      exportCanvas.width = size;
      exportCanvas.height = size;
      const ctx = exportCanvas.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);

      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 14;
      ctx.strokeRect(10, 10, size - 20, size - 20);

      if (currentMode !== 'oekaki') {
        ctx.strokeStyle = '#f1f5f9';
        ctx.lineWidth = 6;
        ctx.setLineDash([16, 16]);
        ctx.beginPath();
        ctx.moveTo(size / 2, 0); ctx.lineTo(size / 2, size);
        ctx.moveTo(0, size / 2); ctx.lineTo(size, size / 2);
        ctx.stroke();
        ctx.setLineDash([]);

        let fontSize = 780;
        if (currentChar.length >= 3) fontSize = 350;
        else if (currentChar.length === 2) fontSize = 520;

        ctx.font = `900 ${fontSize}px -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText(currentChar, size / 2, size / 2 + 35);
      }

      ctx.drawImage(drawCanvas, 0, 0, size, size);

      if (currentMode !== 'oekaki' && hasStamped) {
        ctx.save();
        ctx.translate(size - 220, 220);
        ctx.rotate((12 * Math.PI) / 180);
        ctx.strokeStyle = '#ff3838';
        ctx.fillStyle = '#ff3838';
        
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.arc(0, 0, 150, 0, Math.PI * 2);
        ctx.stroke();

        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.arc(0, 0, 120, 0, Math.PI * 2);
        ctx.stroke();

        ctx.font = '900 32px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('たいへんよくできました', 0, 0);
        ctx.restore();
      }

      ctx.font = '900 36px sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.textAlign = 'left';
      ctx.fillText(currentMode === 'oekaki' ? 'coki おえかき' : 'coki なぞりがき', 30, size - 30);

      return exportCanvas;
    }

    document.getElementById('btn-download-png').addEventListener('click', () => {
      sound.playPop(780);
      const canvas = generateCombinedCanvas();
      const imageURL = canvas.toDataURL('image/png');

    window.addEventListener('resize', resizeCanvases);
